name: Twitch daily digest

# 매일 10:00 KST (= 01:00 UTC). GitHub 스케줄은 혼잡 시 몇~수십 분 늦게 실행될 수 있습니다.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  actions: read   # chat-logger가 올린 채팅 로그 아티팩트 읽기
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: twitch_digest/requirements.txt
      - run: pip install -r twitch_digest/requirements.txt
      - name: Build digest and post to Slack
        run: python -m twitch_digest.digest
        env:
          TWITCH_CHANNEL: ${{ vars.TWITCH_CHANNEL }}
          GAME_NAMES: ${{ vars.GAME_NAMES }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
