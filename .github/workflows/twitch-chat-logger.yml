name: Twitch chat logger

# 30분마다 방송 중인지 확인하고, 방송 중이면 끝날 때까지 채팅을 기록합니다.
# 방송 시작 직후부터 기록하고 싶으면 Actions 탭에서 "Run workflow"를 눌러 바로 시작하세요.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# 한 번에 하나만 실행. 실행 중에 들어온 요청은 대기했다가 이어서 기록합니다(6시간 넘는 방송 대응).
concurrency:
  group: twitch-chat-logger
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: twitch_digest/requirements.txt
      - run: pip install -r twitch_digest/requirements.txt
      - name: Record chat while live
        run: python -m twitch_digest.chat_logger
        env:
          TWITCH_CHANNEL: ${{ vars.TWITCH_CHANNEL }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          MAX_RUNTIME_MIN: "340"
      - name: Upload chat log
        if: always() && hashFiles('chatlogs/*.jsonl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: chatlog-${{ github.run_id }}-${{ github.run_attempt }}
          path: chatlogs/
          retention-days: 3
